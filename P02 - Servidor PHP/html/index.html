<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de inscripción</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <div class="contenedor">

        <h1>Inscripción del alumnado</h1>

        <p class="descripcion">
            Introduce tus datos académicos:
        </p>

        <form action="procesar.php" method="POST">

            <div class="grupo">
                <label for="nombre">Nombre y apellidos:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div class="grupo">
                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo" required>
            </div>

            <div class="grupo">
                <label for="actividad">Actividad:</label>
                 <select id="actividad" name="actividad" required>
                    <option value="robotica">Robótica</option>
                    <option value="desarrollo-de-videojuegos">Desarrollo de videojuegos</option>
                    <option value="ciberseguridad">Ciberseguridad</option>
                    <option value="diseño-e-impresion-3d">Diseño e impresión 3D</option>
                </select>
            </div>

            <div class="grupo">
                <label>Turnos disponibles:</label>

                <div class="seleccion-turno">
                    <label class="opcion-turno">
                        <input type="radio" name="turno" value="mañana" required>
                        Mañana
                    </label>

                    <label class="opcion-turno">
                        <input type="radio" name="turno" value="tarde">
                        Tarde
                    </label>
                </div>
            </div>

            <div class="opciones">

                <p class="titulo-opciones">
                    Material necesario
                </p>

                <label class="opcion" for="material">
                    <input
                        type="checkbox"
                        id="portatil"
                        name="portatil"
                        value="500"
                    >
                    Ordenador portátil
                </label>
                <label class="opcion" for="material">
                    <input
                        type="checkbox"
                        id="auriculares"
                        name="auriculares"
                        value="20"
                    >
                    Auriculares
                </label>
                <label class="opcion" for="material">
                    <input
                        type="checkbox"
                        id="material-de-escritura"
                        name="material-de-escritura"
                        value="10"
                    >
                    Material de escritura
                </label>
                <label>Observaciones: </label>
                    <textarea style="resize:none; width: 300px">

                    </textarea>
                
                
            </div>

            <div class="botones">
                <button type="submit" class="enviar">
                    Enviar formulario
                </button>

                <button type="reset" class="limpiar">
                    Limpiar
                </button>
            </div>

        </form>

        <p class="nota">
            Los datos introducidos se enviarán al servidor mediante
            el método GET.
        </p>

    </div>

</body>
</html>
